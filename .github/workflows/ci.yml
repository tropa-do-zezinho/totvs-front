name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  image:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build production image
        run: docker build --tag totvs-front:ci .

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: totvs-front-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Resolve production endpoints and registry
        env:
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          API_URL_OVERRIDE: ${{ vars.NEXT_PUBLIC_API_URL }}
          WS_URL_OVERRIDE: ${{ vars.NEXT_PUBLIC_WS_URL }}
        run: |
          set -euo pipefail
          suffix="${SUBSCRIPTION_ID//-/}"
          echo "ACR_NAME=acrtotvs${suffix:0:12}" >> "$GITHUB_ENV"
          api_fqdn="$(az containerapp show --name ca-totvs-api --resource-group rg-totvs-prod --query properties.configuration.ingress.fqdn --output tsv)"
          test -n "$api_fqdn"
          echo "PUBLIC_API_URL=${API_URL_OVERRIDE:-https://$api_fqdn}" >> "$GITHUB_ENV"
          echo "PUBLIC_WS_URL=${WS_URL_OVERRIDE:-wss://$api_fqdn/ws}" >> "$GITHUB_ENV"
      - name: Build and push immutable image
        run: |
          set -euo pipefail
          image="$ACR_NAME.azurecr.io/totvs-front:$GITHUB_SHA"
          az acr login --name "$ACR_NAME"
          docker build --build-arg "NEXT_PUBLIC_API_URL=$PUBLIC_API_URL" --build-arg "NEXT_PUBLIC_WS_URL=$PUBLIC_WS_URL" --tag "$image" .
          docker push "$image"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
      - name: Publish Container Apps revision
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --yes
          az containerapp update --name ca-totvs-front --resource-group rg-totvs-prod --image "$IMAGE"
          az containerapp show --name ca-totvs-front --resource-group rg-totvs-prod --query "{revision:properties.latestRevisionName,status:properties.provisioningState}" --output json
